spring:
  cloud:
    nacos:
      discovery:
        enabled: true
        fail-fast: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: portal
          uri: lb://portal
          predicates:
            - Path=/user/**,/dept/**,/notify/**,/operatelog/**
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/order/**,/aftersale/**,/stock/**,/sku/**,/message/**
        - id: process-service
          uri: lb://process-service
          predicates:
            - Path=/process/**
