# 不要把 /api/auth/** 转到 portal，登录登出只在 gateway
spring:
  cloud:
    gateway:
      routes:
        - id: portal
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/user/**,/dept/**,/notify/**,/operatelog/**
        - id: trade-service
          uri: http://127.0.0.1:8082
          predicates:
            # 订单 / 售后 / SKU / 库存 同属 trade-service
            - Path=/order/**,/aftersale/**,/stock/**,/sku/**
        - id: process-service
          uri: http://127.0.0.1:8083
          predicates:
            - Path=/process/**
