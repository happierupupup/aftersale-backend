# 不要把 /api/auth/** 转到 portal，登录登出只在 gateway
spring:
  cloud:
    gateway:
      routes:
        - id: portal
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/user/**,/dept/**,/notify/**,/operatelog/**
        - id: aftersale-service
          uri: http://127.0.0.1:8082
          predicates:
            # 模拟订单接口在最简前缀 /order/**，售后单在 /aftersale/**
            - Path=/aftersale/**,/order/**
        - id: stock-service
          uri: http://127.0.0.1:8083
          predicates:
            # SKU 档案在最简前缀 /sku/**，库存变动在 /stock/**
            - Path=/stock/**,/sku/**
