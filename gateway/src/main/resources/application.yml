server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: local
  autoconfigure:
    exclude:
      - com.yean.common.exception.GlobalExceptionHandler
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

gateway:
  portal-url: http://127.0.0.1:8081
  jwt:
    secret: yean-aftersale-gateway-jwt-hs256-secret-key
    expire-seconds: 7200
  auth:
    whitelist:
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/refresh
      - /actuator/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
