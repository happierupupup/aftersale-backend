server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: local
  autoconfigure:
    exclude:
      - com.yean.common.exception.GlobalExceptionHandler
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false
    sentinel:
      eager: true
      # 规则见 SentinelRulesConfig（本地硬编码）；Dashboard 可选，例：127.0.0.1:8858
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: application/json;charset=UTF-8
          response-body: '{"code":429,"msg":"请求过于频繁，请稍后再试","data":null}'
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

gateway:
  portal-url: http://127.0.0.1:8081
  jwt:
    secret: yean-aftersale-gateway-jwt-hs256-secret-key
    # Access 短寿命（API 鉴权）；Refresh 长寿命（仅 Cookie 续期，续期时旧 Refresh 拉黑）
    access-expire-seconds: 1800
    refresh-expire-seconds: 604800
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth
    # 本地 HTTP 联调 false；上 HTTPS 后改为 true
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
  auth:
    whitelist:
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/refresh
      - /actuator/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
    # 路径级 ACL：命中规则才校验角色；未配置的路径默认放行。ADMIN 恒通。
    acl:
      enabled: true
      rules:
        # —— 售后写操作 ——
        - path: /aftersale/apply
          methods: [POST]
          roles: [USER]
        - path: /aftersale/withdraw
          methods: [POST]
          roles: [USER]
        - path: /aftersale/receive
          methods: [POST]
          roles: [USER]
        - path: /aftersale/approve
          methods: [POST]
          roles: [MERCHANT]
        - path: /aftersale/reject
          methods: [POST]
          roles: [MERCHANT]
        - path: /aftersale/refund
          methods: [POST]
          roles: [MERCHANT]
        - path: /aftersale/ship
          methods: [POST]
          roles: [WAREHOUSE]
        - path: /aftersale/rollback
          methods: [POST]
          roles: [ADMIN]
        # pending-remind / timeout / process-compensate / process-start
        - path: /aftersale/job/**
          methods: [POST]
          roles: [ADMIN]
        # —— 库存写 ——
        - path: /stock/deduct
          methods: [POST]
          roles: [WAREHOUSE]
        - path: /stock/rollback
          methods: [POST]
          roles: [WAREHOUSE]
        # —— SKU 写 ——
        - path: /sku
          methods: [POST]
          roles: [ADMIN]
        - path: /sku/**
          methods: [PUT, DELETE]
          roles: [ADMIN]
        # —— 订单写 ——
        - path: /order
          methods: [POST]
          roles: [ADMIN]
        - path: /order/upload
          methods: [POST]
          roles: [ADMIN]
        # —— 用户 / 部门写 ——
        - path: /user
          methods: [POST]
          roles: [ADMIN]
        - path: /user/**
          methods: [PUT, DELETE]
          roles: [ADMIN]
        - path: /dept
          methods: [POST]
          roles: [ADMIN]
        - path: /dept/**
          methods: [PUT, DELETE]
          roles: [ADMIN]
        # —— outbox 手动投递 ——
        - path: /message/job/**
          methods: [POST]
          roles: [ADMIN]
        # —— 流程调试写 ——
        - path: /process/start
          methods: [POST]
          roles: [ADMIN]
        - path: /process/complete
          methods: [POST]
          roles: [ADMIN]
        - path: /process/reject
          methods: [POST]
          roles: [ADMIN]
        - path: /process/withdraw
          methods: [POST]
          roles: [ADMIN]
        - path: /process/rollback
          methods: [POST]
          roles: [ADMIN]
        - path: /process/timeout-close
          methods: [POST]
          roles: [ADMIN]

# OpenFeign 写操作日志直连 portal（不经网关，避免套娃）
yean:
  operatelog:
    portal-url: ${gateway.portal-url}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
