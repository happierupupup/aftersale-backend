server:
  port: 8082

spring:
  application:
    name: trade-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/aftersale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.yean.trade
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sku:
  cache-ttl-seconds: 300

# RocketMQ：节点流转后直发售后通知（阶段 8 基础版，尚未 outbox）
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: aftersale-trade-producer
    send-message-timeout: 3000

# 本地直连可在 body 填操作人；正式经网关关掉
yean:
  operator:
    allow-body: true
  operatelog:
    portal-url: http://127.0.0.1:8081
  notify:
    portal-url: http://127.0.0.1:8081
    warehouse-user-id: 3
  process:
    url: http://127.0.0.1:8083

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
