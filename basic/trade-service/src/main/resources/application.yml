server:
  port: 8082

spring:
  application:
    name: trade-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/aftersale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    # 对齐压测 VU=50；apply 持连接期间还会 Feign process / portal
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.yean.trade
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sku:
  cache-ttl-seconds: 300

# RocketMQ：outbox Sender 投递售后通知（阶段 8b）
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: aftersale-trade-producer
    send-message-timeout: 3000

# 本地直连可在 body 填操作人；正式经网关关掉
yean:
  operator:
    allow-body: true
  operatelog:
    portal-url: http://127.0.0.1:8081
  notify:
    # outbox=写本地消息表（默认）；sync=请求内直调 portal（仅 §9.4 对照压测，测完改回）
    delivery: outbox
    portal-url: http://127.0.0.1:8081
    warehouse-user-id: 3
  process:
    url: http://127.0.0.1:8083
  schedule:
    pending-remind:
      enabled: true
      # 每天 10:00（Asia/Shanghai）
      cron: "0 0 10 * * ?"
      scan-limit: 1000
      preview-limit: 5
    local-message:
      enabled: true
      # 每 5 秒扫 NEW
      cron: "0/5 * * * * ?"
      scan-limit: 100
      max-retry: 16
      retry-base-seconds: 5
    timeout-close:
      enabled: true
      # 每天 2:30（Asia/Shanghai）：产生超过 48h 未办结则自动关闭
      cron: "0 30 2 * * ?"
      timeout-hours: 48
      scan-limit: 200
    process-compensate:
      enabled: true
      # 每 10 秒扫 NEW：流程已推进、本地失败后的 rollback 重试
      cron: "0/10 * * * * ?"
      scan-limit: 50
      max-retry: 32
      retry-base-seconds: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
