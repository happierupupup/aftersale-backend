server:
  port: 8082

spring:
  application:
    name: aftersale-service
  profiles:
    active: local
  datasource:
    dynamic:
      primary: core
      strict: true
      datasource:
        core:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/aftersale_core?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: 123456
        order:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/aftersale_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.yean.aftersale
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 本地直连可在 body 填操作人；正式经网关关掉
yean:
  operator:
    allow-body: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
