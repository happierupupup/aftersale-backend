server:
  port: 8083

spring:
  application:
    name: process-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/aftersale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    # Activiti start 在嵌套事务/ID 块分配时会占多条连接；默认 10 在 VU≥20 压测会池耗尽
    hikari:
      maximum-pool-size: 80
      minimum-idle: 10
      connection-timeout: 10000
  activiti:
    database-schema-update: true
    check-process-definitions: true
    async-executor-activate: false
    history-level: full
    # 关闭 Activiti 自带 security 用户校验（本服务用 role 字符串校验候选组）
    security:
      enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
